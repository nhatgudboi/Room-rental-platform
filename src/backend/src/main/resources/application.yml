server:
  port: 8080

spring:
  application:
    name: rental-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54333/rental_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    access-token-expiration-ms: 1800000 # 30 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:SANDBOX_TMN}
    hash-secret: ${VNPAY_HASH_SECRET:SANDBOX_SECRET}
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:3000/booking/vnpay-return
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
