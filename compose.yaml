services:
  postgres:
    image: postgres:16-alpine
    container_name: rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54333:5432"
    volumes:
      - rental_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_platform"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  rental_postgres_data:
    name: rental_postgres_16_data
